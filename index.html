<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BUILD ANYWHERE ONLINE</title><style>
*{box-sizing:border-box}body{margin:0;background:#121a21;color:#f5f5f5;font:14px system-ui,sans-serif;overflow:hidden}canvas{display:block;touch-action:none}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.panel{background:#14232bdc;border:1px solid #ffffff30;border-radius:12px;padding:10px;backdrop-filter:blur(10px);pointer-events:auto}.brand{font-weight:850;letter-spacing:1px;font-size:17px}.muted{opacity:.7;font-size:11px}.tools{position:absolute;bottom:12px;left:12px;right:12px;display:flex;gap:8px;align-items:end;justify-content:space-between;pointer-events:none}.catalog{display:flex;gap:5px;flex-wrap:wrap;max-width:680px}.panel button{color:#fff;background:#30444e;border:1px solid #66808a;border-radius:7px;padding:9px;cursor:pointer;font-weight:650}.panel button.active{background:#c78b4e;color:#111}.actions{display:flex;flex-wrap:wrap;gap:5px;max-width:250px}.hint{position:absolute;top:75px;left:12px;max-width:300px;line-height:1.5}.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#162630e8;padding:15px 22px;border-radius:10px;display:none;pointer-events:none}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;color:#ffffff99}#mobile{display:none}@media(max-width:800px){.tools{flex-direction:column;align-items:stretch}.catalog{max-width:none}.catalog button{font-size:12px;padding:7px}.actions{max-width:none}.hint{font-size:11px;top:70px;max-width:200px}.brand{font-size:13px}#mobile{display:flex;position:absolute;right:12px;top:100px;flex-direction:column;gap:8px}.panel{padding:7px}}
</style></head><body><div id="hud"><div class="panel"><div class="brand">BUILD ANYWHERE <span style="color:#e6b879">ONLINE</span></div><div class="muted">KARTEL99GAMES · Prototype 0.2</div></div><div class="panel"><span id="count">0</span> éléments construits</div></div><div class="panel hint">Glisser pour tourner la caméra · Molette/pincement pour zoomer · Cliquer/toucher le terrain pour construire · R pour pivoter · Échap pour annuler</div><div id="mobile" class="panel"><button id="left">↶ Pivoter</button><button id="right">↷ Pivoter</button><button id="place">＋ Poser</button></div><div id="cross">＋</div><div class="tools"><div class="panel catalog" id="catalog"></div><div class="panel actions"><button id="rotate">↻ Rotation</button><button id="remove">⌫ Supprimer</button><button id="save">💾 Sauver</button><button id="load">↩ Charger</button><button id="clear">✕ Vider</button></div></div><div class="toast" id="toast"></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa4c9dc);scene.fog=new THREE.Fog(0xa4c9dc,90,210);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f7ff,0x58623f,2));const sun=new THREE.DirectionalLight(0xffeed0,2.3);sun.position.set(-25,45,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-75;sun.shadow.camera.right=75;sun.shadow.camera.top=75;sun.shadow.camera.bottom=-75;scene.add(sun);
const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});const grass=mat(0x6d935c),wood=mat(0xb48c64),stone=mat(0xa5a8a2),wall=mat(0xe6d9c3),roof=mat(0x56606a),glass=new THREE.MeshStandardMaterial({color:0x82c4df,metalness:.15,roughness:.15,transparent:true,opacity:.65}),dark=mat(0x4d423a);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(100,50,0x506b51,0x71936b);grid.position.y=.015;grid.material.transparent=true;grid.material.opacity=.26;scene.add(grid);
const types=[['foundation','Fondation'],['floor','Plancher'],['wall','Mur'],['door','Porte'],['window','Fenêtre'],['roof','Toit'],['stairs','Escalier'],['pillar','Pilier'],['table','Table'],['chair','Chaise'],['sofa','Canapé'],['bed','Lit'],['cabinet','Armoire'],['lamp','Lampe'],['plant','Plante'],['rug','Tapis'],['shelf','Étagère']];const objects=[];let selected='foundation',rotation=0,erase=false;const SIZE=4;
function block(w,h,d,m,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return o}
function make(type){const g=new THREE.Group();if(type==='foundation')g.add(block(4,.35,4,stone,0,.175,0));if(type==='floor')g.add(block(4,.18,4,wood,0,.09,0));if(type==='wall')g.add(block(4,3,.22,wall,0,1.5,0));if(type==='door'){g.add(block(.9,3,.22,wall,-1.55,1.5,0),block(.9,3,.22,wall,1.55,1.5,0),block(2.2,.55,.22,wall,0,2.725,0),block(1.85,2.42,.1,dark,0,1.21,0));}if(type==='window'){g.add(block(4,.65,.22,wall,0,.325,0),block(4,.65,.22,wall,0,2.675,0),block(.85,1.7,.22,wall,-1.575,1.5,0),block(.85,1.7,.22,wall,1.575,1.5,0),block(2.3,1.7,.08,glass,0,1.5,0),block(.1,1.7,.25,wood,0,1.5,0));}if(type==='roof'){const shape=new THREE.Shape();shape.moveTo(-2,0);shape.lineTo(0,1.45);shape.lineTo(2,0);shape.lineTo(-2,0);const geo=new THREE.ExtrudeGeometry(shape,{depth:4,bevelEnabled:false});geo.translate(0,0,-2);const mesh=new THREE.Mesh(geo,roof);mesh.castShadow=true;mesh.receiveShadow=true;g.add(mesh);}if(type==='stairs'){for(let i=0;i<6;i++)g.add(block(3,(i+1)*.5,.6,wood,0,(i+1)*.25,-1.7+i*.65));}if(type==='pillar')g.add(block(.45,3,.45,stone,0,1.5,0));if(type==='table'){g.add(block(2,.15,1.2,wood,0,.9,0));for(const x of [-.8,.8])for(const z of [-.45,.45])g.add(block(.13,.85,.13,dark,x,.43,z))}if(type==='chair'){g.add(block(.75,.14,.75,wood,0,.5,0),block(.75,.8,.13,wood,0,.95,.31));for(const x of [-.28,.28])for(const z of [-.28,.28])g.add(block(.1,.5,.1,dark,x,.25,z))}if(type==='sofa'){g.add(block(2.3,.5,1,mat(0x647d95),0,.4,0),block(2.3,.85,.22,mat(0x647d95),0,.9,.4))}if(type==='bed'){g.add(block(2,.4,2.8,dark,0,.3,0),block(1.9,.2,2.6,mat(0xddd6c8),0,.6,0),block(1.9,.12,1.5,mat(0x607c9c),0,.75,-.5))}if(type==='cabinet'){g.add(block(1.6,2.2,.7,wood,0,1.1,0),block(.05,2,.04,dark,0,1.1,.36))}if(type==='lamp'){g.add(block(.4,.12,.4,dark,0,.06,0),block(.07,1.7,.07,stone,0,.9,0),block(.6,.6,.6,mat(0xffdc93),0,1.9,0))}if(type==='plant'){g.add(block(.6,.5,.6,mat(0xa66b4c),0,.25,0));const l=new THREE.Mesh(new THREE.IcosahedronGeometry(.7,1),mat(0x397443));l.position.y=1.1;g.add(l)}if(type==='rug')g.add(block(2.8,.04,2,mat(0x9b5950),0,.03,0));if(type==='shelf'){for(let i=0;i<4;i++)g.add(block(1.7,.12,.45,wood,0,.4+i*.55,0));g.add(block(.1,2.2,.5,dark,-.8,1.1,0),block(.1,2.2,.5,dark,.8,1.1,0))}return g}
const ghost=make(selected);scene.add(ghost);function setGhost(type){scene.remove(ghost);ghost.clear();ghost.add(...make(type).children);scene.add(ghost);ghost.traverse(o=>{if(o.isMesh){o.material=new THREE.MeshBasicMaterial({color:0x65e8bd,transparent:true,opacity:.45,depthWrite:false});o.castShadow=false}})}setGhost(selected);
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let target=new THREE.Vector3(),valid=false;const cameraTarget=new THREE.Vector3(0,0,0);let yaw=.65,pitch=.72,dist=27;function cameraUpdate(){camera.position.set(cameraTarget.x+dist*Math.sin(yaw)*Math.cos(pitch),cameraTarget.y+dist*Math.sin(pitch),cameraTarget.z+dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(cameraTarget)}cameraUpdate();
function pointerAt(x,y){pointer.set(x/innerWidth*2-1,-y/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObject(ground);if(!hits.length){valid=false;ghost.visible=false;return}valid=true;ghost.visible=!erase;const p=hits[0].point;const edge=['wall','door','window'].includes(selected);let angle=rotation*Math.PI/2;if(edge){const cx=Math.floor(p.x/4)*4+2,cz=Math.floor(p.z/4)*4+2;const dx=p.x-cx,dz=p.z-cz;if(Math.abs(dx)>Math.abs(dz)){target.set(cx+(dx>=0?2:-2),0,cz);angle+=Math.PI/2}else target.set(cx,0,cz+(dz>=0?2:-2))}else{const snap=['table','chair','sofa','bed','cabinet','lamp','plant','rug','shelf'].includes(selected)?.5:4;target.set(Math.round(p.x/snap)*snap,0,Math.round(p.z/snap)*snap)}ghost.position.copy(target);ghost.rotation.y=angle}
function place(){if(!valid)return;if(erase){ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(objects,true);if(hits.length){let hit=hits[0].object;while(hit.parent&&!objects.includes(hit))hit=hit.parent;if(objects.includes(hit)){scene.remove(hit);objects.splice(objects.indexOf(hit),1);updateCount()}}return}const obj=make(selected);obj.position.copy(target);obj.rotation.y=ghost.rotation.y;obj.userData={type:selected,rotation,angle:ghost.rotation.y};scene.add(obj);objects.push(obj);updateCount()}
function updateCount(){document.querySelector('#count').textContent=objects.length}function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1700)}function setType(t){selected=t;erase=false;setGhost(t);document.querySelectorAll('#catalog button').forEach(b=>b.classList.toggle('active',b.dataset.type===t));document.querySelector('#remove').classList.remove('active')}
for(const [id,name] of types){const b=document.createElement('button');b.textContent=name;b.dataset.type=id;b.onclick=()=>setType(id);document.querySelector('#catalog').append(b)}setType(selected);
let down=null,moved=false;renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};moved=false;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(moved){yaw-=dx*.006;pitch=Math.max(.15,Math.min(1.45,pitch+dy*.005));cameraUpdate()}down={x:e.clientX,y:e.clientY}}pointerAt(e.clientX,e.clientY)});renderer.domElement.addEventListener('pointerup',e=>{if(!moved){pointerAt(e.clientX,e.clientY);place()}down=null});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(6,Math.min(85,dist+e.deltaY*.025));cameraUpdate()},{passive:true});let pinch=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)dist=Math.max(6,Math.min(85,dist+(pinch-d)*.06));pinch=d;cameraUpdate()}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=0);
function rotate(n=1){rotation=(rotation+n+4)%4;ghost.rotation.y=rotation*Math.PI/2}document.querySelector('#rotate').onclick=()=>rotate();document.querySelector('#left').onclick=()=>rotate(-1);document.querySelector('#right').onclick=()=>rotate();document.querySelector('#place').onclick=()=>{pointerAt(innerWidth/2,innerHeight/2);place()};document.querySelector('#remove').onclick=()=>{erase=!erase;ghost.visible=!erase;document.querySelector('#remove').classList.toggle('active',erase);toast(erase?'Mode suppression':'Mode construction')};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')rotate();if(e.key==='Escape'){erase=false;setType(selected)}if(e.key==='Delete'){erase=true;toast('Cliquez une pièce pour supprimer')}});
const KEY='build-anywhere-online-v01';function save(){localStorage.setItem(KEY,JSON.stringify(objects.map(o=>({type:o.userData.type,rotation:o.userData.rotation,angle:o.rotation.y,x:o.position.x,z:o.position.z}))));toast('Construction sauvegardée')}function load(){const raw=localStorage.getItem(KEY);if(!raw){toast('Aucune sauvegarde');return}objects.forEach(o=>scene.remove(o));objects.length=0;try{for(const p of JSON.parse(raw)){if(!types.some(t=>t[0]===p.type))continue;const o=make(p.type);o.position.set(p.x,0,p.z);o.rotation.y=p.angle??p.rotation*Math.PI/2;o.userData={type:p.type,rotation:p.rotation};scene.add(o);objects.push(o)}updateCount();toast('Construction chargée')}catch{toast('Sauvegarde invalide')}}document.querySelector('#save').onclick=save;document.querySelector('#load').onclick=load;document.querySelector('#clear').onclick=()=>{if(confirm('Supprimer tous les éléments de la scène ?')){objects.forEach(o=>scene.remove(o));objects.length=0;updateCount()}};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});pointerAt(innerWidth/2,innerHeight/2);function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();
</script></body></html>
